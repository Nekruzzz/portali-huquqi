{% extends 'base.html' %}
{% from '_macros.html' import csrf with context %}
{% block title %}{{ t('forgot_title') }}{% endblock %}
{% block content %}
<div class="wrap narrow section">
  <div class="panel">
    <h1>{{ t('forgot_title') }}</h1>
    <p class="muted">{{ t('forgot_text') }}</p>
    <form method="post" class="stack">
      {{ csrf() }}
      <label>{{ t('email') }}<input type="email" name="email" autocomplete="email" required autofocus></label>
      <button class="btn btn-primary btn-block" type="submit">{{ t('send_link') }}</button>
    </form>
    <p class="center"><a href="{{ url_for('login') }}">← {{ t('login') }}</a></p>
  </div>
</div>
{% endblock %}
