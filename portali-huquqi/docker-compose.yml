# Production setup for one server: the portal, a scheduler for e-mail and reminders,
# and Caddy in front for HTTPS (certificates are obtained automatically).
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    volumes:
      - portal-data:/data

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - portal-data:/data
    # every 10 minutes: deliver queued e-mail; once an hour: consultation reminders (each follower is reminded once)
    command: >
      sh -c 'flask --app app init-db; n=0; while true; do
             flask --app app send-mail;
             if [ $$((n % 6)) -eq 0 ]; then flask --app app send-reminders; fi;
             n=$$((n + 1)); sleep 600; done'

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  portal-data:
  caddy-data:
  caddy-config:
